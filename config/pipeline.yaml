# Baseline ablation row: fixed-size chunks, dense-only retrieval, no rerank.
# Every experiment knob lives in this file. A new ablation row is a new YAML
# in config/ (copy this file, change knobs) -- never a code branch.
experiment:
  name: baseline_fixed_dense
  description: Fixed-size token chunks, BGE dense retrieval only, no reranking.

corpus:
  manifest: data/raw/manifest.json
  raw_dir: data/raw
  processed_dir: data/processed

ingest:
  parser: pymupdf              # pymupdf (flat text) | pymupdf4llm (structure-aware markdown)
  chunking:
    strategy: fixed            # fixed | structure
    # 510, not 512: the embedder's window (index.embedding.model -> 512) counts
    # [CLS] and [SEP], so the content budget is 512 - 2. At 512 the encoder
    # silently truncated 440/461 chunk tails -- doubly bad given BGE pools on
    # CLS, which already underweights the tail. `quant-rag index` warns if this
    # ever stops lining up.
    chunk_tokens: 510
    overlap_tokens: 64
    tokenizer: BAAI/bge-base-en-v1.5   # count tokens with the embedder's tokenizer

index:
  # Search backend over the stored vectors. Both are exact (every chunk scored,
  # true top-k); the choice does not change rankings, only the machinery.
  # exact_numpy is the default -- see README "Design decisions".
  backend: exact_numpy       # exact_numpy | faiss_flat_ip
  embedding:
    model: BAAI/bge-base-en-v1.5
    normalize: true            # L2-normalize, so inner product == cosine
    batch_size: 32
    device: auto               # auto | cpu | mps | cuda
    # Prepended to QUERIES ONLY, never to passages -- the BGE model card is
    # explicit that passages get no instruction. The card lists this exact
    # string for bge-*-v1.5 and recommends it for short-query-to-long-passage
    # retrieval, while also saying v1.5 was trained to work without it and
    # loses only "a slight degradation" when omitted, and that the setting
    # should be chosen by measuring. So it is a knob: set it to "" for the
    # no-instruction ablation row. Does not affect stored vectors, so both
    # settings share one index.
    query_instruction: "Represent this sentence for searching relevant passages: "
  faiss:
    # Only read when backend == faiss_flat_ip.
    index_type: flat_ip        # exact inner product; corpus is small enough
  bm25:
    enabled: false
    k1: 1.5
    b: 0.75

retrieve:
  mode: dense                  # dense | sparse | hybrid
  top_k: 10
  candidate_k: 50              # per-retriever depth before fusion / rerank
  fusion:
    method: rrf
    rrf_k: 60
  rerank:
    enabled: false
    model: BAAI/bge-reranker-base
    top_n: 10

generate:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  effort: medium               # output_config.effort; thinking is adaptive by default
  cite_chunks: true
  abstain_if_no_evidence: true

eval:
  golden_set: eval/golden_set.jsonl
  results_dir: eval/results
  k_values: [1, 3, 5, 10]
  ragas:
    enabled: false
    metrics: [faithfulness, answer_relevancy, context_precision, context_recall]
  seed: 0
