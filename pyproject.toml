[project]
name = "quant-rag-research"
version = "0.1.0"
description = "Eval-centric RAG ablation study over an RL / quant-finance paper corpus"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nathan Williams" }]
# Runtime deps are added deliberately, one PR at a time (see CLAUDE.md rule 5).
# The corpus downloader is stdlib-only so it runs before any of them exist.
dependencies = [
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    # Index stage. transformers is listed explicitly even though
    # sentence-transformers pulls it in: ingest/tokenizer.py imports it directly
    # for exact BGE token counts, independent of whether embedding runs.
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "numpy>=1.26",
    # Optional backend only: index.backend defaults to exact_numpy, which is
    # what the corpus size calls for and what keeps torch's and faiss's
    # duplicate libomp out of one process. See README "Design decisions".
    "faiss-cpu>=1.8",
]

[project.scripts]
quant-rag = "quant_rag.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_rag"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
